name: Update RSS feeds

on:
  workflow_dispatch: ## Manual run
  schedule: ## Daily scheduled run
    - cron: "28 5 * * *"
      timezone: "Europe/Athens"

  # push: ## Run on push (disabled)
  #   branches:
  #     - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build RSS feeds
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install Chromium
        run: |
          playwright install --with-deps chromium

      - name: Generate RSS feeds
        run: |
          python create_xml.py

      - name: Check generated feeds
        run: |
          test -s _site/oxecon_feed.xml
          echo "OxEcon RSS feed generated successfully"
          head -n 10 _site/oxecon_feed.xml
          
          test -s _site/oxhist_feed.xml
          echo "OxHist RSS feed generated successfully"
          head -n 10 _site/oxhist_feed.xml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
